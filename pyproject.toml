[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "total-tribe-v2"
version = "0.1.0"
description = "Self-hosted Gradio UI wrapping Meta's TRIBE v2 brain-encoding model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "CC-BY-NC-4.0"}
authors = [{name = "Harsh Patel"}]
dependencies = [
    "gradio>=4.44",
    "nibabel>=5.2",
    "nilearn>=0.10.4",
    "numpy",
    "moviepy>=1.0",
    "pillow>=10.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
gpu = [
    "torch==2.6.0",
    "tribev2[plotting] @ git+https://github.com/facebookresearch/tribev2.git",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: requires CUDA hardware",
  "slow: long-running tests",
]
